name: LayeredKitPreview
options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
packages:
  DesignOSApple:
    path: ../..
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targetTemplates:
  App:
    type: application
    sources:
      - App
      - path: ../CalorieCam/Resources/DemoMeal.png
        buildPhase: resources
    dependencies:
      - package: DesignOSApple
    settings:
      base:
        PRODUCT_NAME: LayeredKitPreview
        PRODUCT_BUNDLE_IDENTIFIER: com.designos.examples.LayeredKitPreview
  UITests:
    type: bundle.ui-testing
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designos.examples.LayeredKitPreview.UITests
targets:
  LayeredKitPreview-iOS:
    templates: [App]
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  LayeredKitPreview-macOS:
    templates: [App]
    platform: macOS
    settings:
      base:
        ENABLE_APP_SANDBOX: YES
  LayeredKitPreview-iOS-UITests:
    templates: [UITests]
    platform: iOS
    dependencies:
      - target: LayeredKitPreview-iOS
  LayeredKitPreview-macOS-UITests:
    templates: [UITests]
    platform: macOS
    dependencies:
      - target: LayeredKitPreview-macOS
schemes:
  LayeredKitPreview-iOS:
    build:
      targets:
        LayeredKitPreview-iOS: all
    test:
      targets: [LayeredKitPreview-iOS-UITests]
  LayeredKitPreview-macOS:
    build:
      targets:
        LayeredKitPreview-macOS: all
    test:
      targets: [LayeredKitPreview-macOS-UITests]
