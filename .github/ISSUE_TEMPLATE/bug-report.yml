name: Bug report
description: Report reproducible package or Gallery behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets or vulnerability details. Use SECURITY.md for those.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - iPadOS
        - macOS
        - Swift Package Manager
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Xcode, Swift, and package revision.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Smallest code or Gallery route that reproduces the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and current DocC recipes.
          required: true
        - label: This report contains no secrets, personal data, or private vulnerability details.
          required: true
