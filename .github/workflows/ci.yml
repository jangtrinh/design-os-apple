name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install XcodeGen and ripgrep
        run: brew install xcodegen ripgrep
      - name: Verify the same release-candidate gates used locally
        env:
          DESIGN_OS_APPLE_GALLERY_RESULTS_DIR: ${{ runner.temp }}/gallery-results
        run: scripts/verify-release-candidate.sh
      - name: Upload Gallery test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-test-results
          path: ${{ runner.temp }}/gallery-results
          if-no-files-found: ignore
