name: Marketing browser preview

on:
  pull_request:
    paths:
      - README.md
      - 'docs/**'
      - scripts/verify-marketing-browser.cjs
      - scripts/generate-catalog-illustrations.py
      - scripts/verify-pages-bundle.py
      - scripts/test-pages-bundle.py
      - scripts/test-catalog-illustrations.py
      - scripts/generate-component-catalog.py
      - scripts/verify-marketing-metadata.py
      - scripts/test-marketing-metadata.py
      - scripts/verify-marketing-image-provenance.py
      - scripts/test-marketing-image-provenance.py
      - scripts/verify-component-image-provenance.py
      - scripts/test-component-image-provenance.py
      - .github/workflows/marketing-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare failure evidence
        run: |
          export MARKETING_BROWSER_OUTPUT="$RUNNER_TEMP/marketing-browser-results"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/marketing-browsers"
          printf 'MARKETING_BROWSER_OUTPUT=%s\n' "$MARKETING_BROWSER_OUTPUT" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          mkdir -p "$MARKETING_BROWSER_OUTPUT"
          printf '%s\n' '{"status":"setup-incomplete","note":"Browser checks have not run."}' > "$MARKETING_BROWSER_OUTPUT/results.json"
      - name: Verify static catalog coverage without JavaScript
        shell: bash
        run: |
          python3 scripts/generate-catalog-illustrations.py --check
          python3 scripts/test-catalog-illustrations.py
          python3 scripts/generate-component-catalog.py --check
          python3 scripts/verify-marketing-metadata.py 2>&1 | tee "$MARKETING_BROWSER_OUTPUT/metadata.log"
          python3 scripts/test-marketing-metadata.py 2>&1 | tee "$MARKETING_BROWSER_OUTPUT/metadata-tests.log"
          node scripts/verify-marketing-browser.cjs --static-only 2>&1 | tee "$MARKETING_BROWSER_OUTPUT/catalog-static.log"
      - name: Build actual Pages bundle
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Verify actual Pages output
        run: |
          python3 scripts/verify-pages-bundle.py --site _site --output "$MARKETING_BROWSER_OUTPUT/pages-bundle.json"
          python3 scripts/test-pages-bundle.py
      - name: Install pinned preview-only tooling
        id: tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/marketing-preview-tools" --registry=https://registry.npmjs.org --no-audit --no-fund --ignore-scripts --save-exact playwright@1.58.2 marked@15.0.12
          "$RUNNER_TEMP/marketing-preview-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify reviewed image provenance
        shell: bash
        run: |
          python3 scripts/verify-marketing-image-provenance.py 2>&1 | tee "$MARKETING_BROWSER_OUTPUT/image-provenance.log"
      - name: Verify native component image provenance
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 scripts/verify-component-image-provenance.py 2>&1 | tee "$MARKETING_BROWSER_OUTPUT/component-image-provenance.log"
      - name: Test provenance guard controls
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 scripts/test-marketing-image-provenance.py 2>&1 | tee "$MARKETING_BROWSER_OUTPUT/image-provenance-tests.log"
      - name: Test component provenance guard controls
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 scripts/test-component-image-provenance.py 2>&1 | tee "$MARKETING_BROWSER_OUTPUT/component-image-provenance-tests.log"
      - name: Validate and capture previews
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        env:
          NODE_PATH: ${{ runner.temp }}/marketing-preview-tools/node_modules
        run: node scripts/verify-marketing-browser.cjs
      - name: Preserve screenshots and check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-browser-preview
          path: ${{ runner.temp }}/marketing-browser-results
          retention-days: 14
          if-no-files-found: error
      - name: Preserve actual Pages bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-pages-bundle
          path: _site
          retention-days: 14
          if-no-files-found: warn
