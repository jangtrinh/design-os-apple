<text x="76" y="602" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#536771">The 94-unit shape is an explanatory example. There is no second spacing or radius</text>
<text x="76" y="633" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#536771">token scale.</text>
