<text x="98" y="275" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182c36">Validate inputs</text>
<text x="98" y="337" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#536771">Aspect ratio: invalid → 1</text>
<text x="98" y="374" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#536771">Length: invalid → 0</text>
<text x="98" y="411" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#536771">Diameter: request →</text>
<text x="98" y="448" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#536771">fallback → 1</text>
<rect x="650" y="237" width="472" height="315" rx="14" fill="#edf5f6" stroke="#ccd9df" stroke-width="2"/>
<text x="670" y="275" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#182c36">Clamp corner radius</text>
<text x="670" y="337" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#536771">r ≤ half the shortest side</text>
<text x="670" y="374" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#536771">Negative or nonfinite r → 0</text>
